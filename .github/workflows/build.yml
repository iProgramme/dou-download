name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: DouyinDownloader-Mac
            add_data_sep: ":"
            hidden_import: webview.platforms.cocoa
          - os: windows-latest
            artifact_name: DouyinDownloader-Windows
            add_data_sep: ";"
            hidden_import: webview.platforms.edgechromium

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: >
          python -m PyInstaller
          --name "DouyinDownloader"
          --onedir
          --windowed
          --add-data "static${{ matrix.add_data_sep }}static"
          --add-data "templates${{ matrix.add_data_sep }}templates"
          --add-data "download_user.py${{ matrix.add_data_sep }}."
          --hidden-import "webview"
          --hidden-import "${{ matrix.hidden_import }}"
          --hidden-import "apscheduler.schedulers.background"
          --hidden-import "apscheduler.triggers.interval"
          --noconfirm
          app.py

      - name: Sign macOS app (ad-hoc)
        if: runner.os == 'macOS'
        run: codesign --force --deep -s - dist/DouyinDownloader.app

      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --sequesterRsrc --keepParent DouyinDownloader.app DouyinDownloader-Mac.zip

      - name: Zip Windows build
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist\DouyinDownloader\* -DestinationPath dist\DouyinDownloader-Windows.zip

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DouyinDownloader-Mac
          path: dist/DouyinDownloader-Mac.zip
          retention-days: 30

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DouyinDownloader-Windows
          path: dist/DouyinDownloader-Windows.zip
          retention-days: 30
